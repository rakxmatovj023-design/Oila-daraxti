/* Layout: generations run left to right as columns, couples stack, a detail panel sits beside the canvas. */
:root{
  --bg:#eef0f1; --panel:#ffffff; --fg:#182226; --mut:#58686d; --line:#c9d2d5;
  --acc:#1b6b66; --acc2:#8a4a78; --soft:#e3ebea; --onacc:#ffffff; --warn:#a2391f;
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101618; --panel:#182125; --fg:#e4ebec; --mut:#92a3a8; --line:#2b383d;

  }
}
:root[data-theme="dark"]{
  --bg:#101618; --panel:#182125; --fg:#e4ebec; --mut:#92a3a8; --line:#2b383d;

}
*{box-sizing:border-box}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.brand{min-width:0;display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}

.side h2{font:400 24px/1.15 var(--display);margin:0;text-wrap:balance}
.life{color:var(--mut);font-variant-numeric:tabular-nums;margin:0}
.grp{display:flex;flex-direction:column;gap:6px}
.grp h3{margin:0;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.chip.g-f{border-left-color:var(--acc2)}

.acts{display:flex;flex-wrap:wrap;gap:8px}

form{display:flex;flex-direction:column;gap:10px}
label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mut)}
label.inl{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:14px}
input[type=text],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;color:var(--fg)}
textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--warn);font-size:13px;margin:0}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h2{font:400 24px var(--display);margin:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;max-width:90vw}
@media (max-width:900px){
  .split{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .canvas{max-height:60vh}
  .row{grid-template-columns:minmax(0,1fr) 84px}
  .row .c2,.row .c3{display:none}
}
@media (prefers-reduced-motion:no-preference){.card,.btn{transition:border-color .15s,box-shadow .15s}}

(function(){

var RESET=":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}";

/* ---------- layout ---------- */
function layout(){
  var ppl=S.people,gen={},changed=true,guard=0,maxg=0;

function detailHTML(p){

  if(p.place)s+='<p style="margin:0">'+esc(p.place)+"</p>";
  if(p.note)s+='<p style="margin:0">'+esc(p.note)+"</p>";
  s+=grp("Ota-ona",par)+grp("Turmush oʻrtogʻi",sp?[sp]:[])+grp("Farzandlar",kids(p.id).sort(function(a,b){return yr(a.born).localeCompare(yr(b.born));}))+grp("Aka-uka, opa-singillar",sibs);
  if(ui.edit&&canEdit){
    s+='<div class="acts"><button class="btn sm" data-act="editp">Tahrirlash</button><button class="btn sm" data-act="addchild">+ Farzand</button>'+(p.spouse?"":'<button class="btn sm" data-act="addspouse">+ Turmush oʻrtogʻi</button>')+"</div>";
    if(ui.confirm==="del:"+p.id)s+='<div class="acts"><button class="btn sm bad" data-act="delok">Ha, oʻchirilsin</button><button class="btn sm" data-act="delno">Yoʻq</button></div>';
    else s+='<div class="acts"><button class="btn sm bad" data-act="del">Oʻchirish</button></div>';
  }
  return s;
}
function formHTML(f){
  var ex=f.id?desc(f.id):{};
  if(f.id)ex[f.id]=1;
  function opts(g,val){
    var o='<option value="">Koʻrsatilmagan</option>';
    S.people.filter(function(p){return (!g||p.gender===g)&&!ex[p.id];}).sort(byName).forEach(function(p){
      o+='<option value="'+p.id+'"'+(p.id===val?" selected":"")+">"+esc(p.name)+(yr(p.born)?" ("+yr(p.born)+")":"")+"</option>";
    });
    return o;
  }
  return '<h2>'+(f.id?"Tahrirlash":"Yangi odam")+'</h2><form id="pf" autocomplete="off">'+
  '<label>Toʻliq ismi<input type="text" id="f-name" value="'+esc(f.name)+'"></label>'+
  '<div class="two"><label>Jinsi<select id="f-gender"><option value="m"'+(f.gender==="m"?" selected":"")+'>Erkak</option><option value="f"'+(f.gender==="f"?" selected":"")+">Ayol</option></select></label>"+
  '<label>Tugʻilgan sana<input type="text" id="f-born" placeholder="1957 yoki 1931-04-12" value="'+esc(f.born)+'"></label></div>'+
  '<label class="inl"><input type="checkbox" id="f-living"'+(f.living?" checked":"")+'> Hayot (tirik odam uchun faqat yil saqlanadi)</label>'+
  '<label>Vafot sanasi<input type="text" id="f-died" placeholder="2004 yoki 2004-06-01" value="'+esc(f.died)+'"'+(f.living?" disabled":"")+"></label>"+
  '<label>Joy<input type="text" id="f-place" value="'+esc(f.place)+'"></label>'+
  '<label>Izoh<textarea id="f-note">'+esc(f.note)+"</textarea></label>"+
  '<div class="two"><label>Otasi<select id="f-father">'+opts("m",f.father)+'</select></label><label>Onasi<select id="f-mother">'+opts("f",f.mother)+"</select></label></div>"+
  '<label>Turmush oʻrtogʻi<select id="f-spouse">'+opts("",f.spouse)+"</select></label>"+
  '<p class="err" id="f-err" hidden></p>'+
  '<div class="acts"><button type="submit" class="btn pri" data-act="savef">Qoʻshish</button><button type="button" class="btn" data-act="cancelf">Bekor qilish</button></div></form>';
}
function sideHTML(){
  if(ui.form)return formHTML(ui.form);
  var p=ui.sel&&P(ui.sel);
  if(p)return detailHTML(p);
  return '<h2>Odamni tanlang</h2><p class="hint">Daraxtdagi kartani bosing: tugʻilgan va vafot yillari, ota-ona, farzandlar va aka-ukalari shu yerda chiqadi.</p><div class="legend"><span><i style="background:var(--acc)"></i>Erkak</span><span><i style="background:var(--acc2)"></i>Ayol</span></div>';
}
function statsHTML(L){
  var n=S.people.length,liv=S.people.filter(function(p){return p.living;}).length;
  return '<div class="stats"><span><b>'+n+"</b> kishi</span><span><b>"+(n?L.maxg+1:0)+"</b> avlod</span><span><b>"+liv+"</b> tirik</span><span><b>"+(n-liv)+"</b> vafot etgan</span></div>";
}

/* ---------- render ---------- */
function renderTop(){
  var h="";
  if(ui.edit&&canEdit)$("ttlbox").innerHTML='<input class="ttl" id="ttl" type="text" value="'+esc(S.title)+'" aria-label="Daraxt nomi">';
  else $("ttlbox").innerHTML="<h1>"+esc(S.title)+"</h1>";
  h+='<div class="seg" role="group" aria-label="Koʻrinish"><button data-act="view" data-v="tree" aria-pressed="'+(ui.view==="tree")+'">Daraxt</button><button data-act="view" data-v="list" aria-pressed="'+(ui.view==="list")+'">Roʻyxat</button></div>';
  if(dl)h+='<button class="btn" data-act="export">JSON yuklab olish</button>';
  if(canEdit)h+='<button class="btn'+(ui.edit?" pri":"")+'" data-act="edit">'+(ui.edit?"Tahrirlash yoqilgan":"Tahrirlash")+"</button>";
  $("actions").innerHTML=h;
}
function renderBar(){
  var h="";
  if(ui.dirty)h='<div class="savebar"><span>'+(ui.saving?"Saqlanmoqda…":"Saqlanmagan oʻzgarishlar bor")+'</span><span class="tools"><button class="btn go" data-act="save"'+(ui.saving?" disabled":"")+'>Saqlash</button><button class="btn" data-act="discard">Bekor qilish</button></span></div>';
  $("bar").innerHTML=h;
}
function renderMain(){
  var el=$("main"),cv=el.querySelector(".canvas"),sl=cv?cv.scrollLeft:0,stp=cv?cv.scrollTop:0;
  var L=layout(),h=statsHTML(L);
  if(S.sample){
    h+='<div class="note"><p>Bu namunaviy oila. Oʻz oilangizni kiritish uchun tahrirlash rejimini yoqing.</p>';
    if(ui.edit&&canEdit){
      h+=ui.confirm==="clear"?'<span class="acts"><button class="btn sm bad" data-act="clearok">Ha, hammasi oʻchirilsin</button><button class="btn sm" data-act="clearno">Yoʻq</button></span>':'<button class="btn sm" data-act="clear">Namunani tozalash</button>';
    }
    h+="</div>";
  }
  if(!S.people.length){
    h+='<div class="empty"><h2>Daraxt hozircha boʻsh</h2><p class="hint">'+(canEdit?"Tahrirlash rejimini yoqing va birinchi odamni qoʻshing.":"Egasi hali hech kimni qoʻshmagan.")+"</p>"+(ui.edit&&canEdit?'<button class="btn pri" data-act="add">Birinchi odamni qoʻshish</button>':"")+(ui.form?'<div class="side" style="width:min(100%,380px);text-align:left">'+formHTML(ui.form)+"</div>":"")+"</div>";
  }else{
    h+='<div class="split"><section class="canvas" aria-label="Oila daraxti">'+(ui.view==="tree"?treeHTML(L):listHTML(L))+'</section><aside class="side" id="side">'+sideHTML()+"</aside></div>";
    if(ui.edit&&canEdit&&!ui.form)h+='<div class="acts"><button class="btn" data-act="add">+ Yangi odam</button></div>';
  }
  el.innerHTML=h;
  cv=el.querySelector(".canvas");
  if(cv){cv.scrollLeft=sl;cv.scrollTop=stp;}
}
function render(){renderTop();renderBar();renderMain();}

/* ---------- editing ---------- */
function blank(){return {id:"",name:"",gender:"m",born:"",died:"",living:true,place:"",note:"",father:"",mother:"",spouse:""};}
function setSpouse(id,sid){
  var p=P(id);
  if(p.spouse&&p.spouse!==sid){var old=P(p.spouse);if(old&&old.spouse===id)old.spouse="";}
  p.spouse=sid||"";
  if(sid){
    var q=P(sid);
    if(q.spouse&&q.spouse!==id){var o2=P(q.spouse);if(o2&&o2.spouse===sid)o2.spouse="";}
    q.spouse=id;
  }
}
function readForm(){
  var f=ui.form,err=$("f-err"),name=$("f-name").value.trim();
  if(!name){err.textContent="Ismni yozing.";err.hidden=false;return;}
  var living=$("f-living").checked,born=$("f-born").value.trim(),died=living?"":$("f-died").value.trim();
  if(living)born=yr(born);
  var rec={name:name,gender:$("f-gender").value,born:born,died:died,living:living,place:$("f-place").value.trim(),note:$("f-note").value.trim(),father:$("f-father").value,mother:$("f-mother").value};
  var sid=$("f-spouse").value,p;
  if(f.id){p=P(f.id);for(var k in rec)p[k]=rec[k];}
  else{p=rec;p.id="p"+Date.now().toString(36);p.spouse="";S.people.push(p);}
  setSpouse(p.id,sid);
  ui.sel=p.id;ui.form=null;ui.dirty=true;
  render();
}
function removePerson(id){
  S.people=S.people.filter(function(p){return p.id!==id;});
  S.people.forEach(function(p){if(p.father===id)p.father="";if(p.mother===id)p.mother="";if(p.spouse===id)p.spouse="";});
  ui.sel=null;ui.confirm="";ui.dirty=true;
}

/* ---------- saving ---------- */
function buildDoc(){
  var css=$("css").textContent,code=$("code").textContent;
  var json=JSON.stringify(S).replace(/</g,"\\u003c");
  var head='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+"</style></head><body>";
  return head+'<title>Ildiz Oila Daraxti</title><meta name="claude:viewport-fit-sides" content="cover">'+
   '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'+
   '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Young+Serif&display=swap">'+
   '<style id="css">'+css+'</style><div id="app">'+SHELL+'</div><script type="application/json" id="state">'+json+'<\/script><script id="code">'+code+"<\/script></body></html>";
}
var SHELL='<div class="wrap"><div class="top"><div class="brand"><div class="eyebrow">Oila daraxti</div><div id="ttlbox"></div></div><div class="tools"><input class="search" id="q" type="text" placeholder="Ism yoki joy boʻyicha qidirish" aria-label="Qidirish"><div id="actions" class="tools"></div></div></div><div id="bar"></div><div id="main"></div></div><div id="toast" hidden></div>';
function save(){
  if(!art){toast("Bu koʻrinishda saqlab boʻlmaydi.");return;}
  remember();ui.saving=true;renderBar();
  art.publish(buildDoc()).then(function(){},function(e){
    ui.saving=false;renderBar();
    var c=e&&e.code;
    toast(c==="conflict"?"Boshqa oʻzgarish saqlandi, sahifa yangilanmoqda.":(c==="not_writer"||c==="not_granted")?"Faqat daraxt egasi saqlay oladi.":"Saqlab boʻlmadi.");
  });
}

/* ---------- events ---------- */
document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-act]");
  if(!b)return;
  var a=b.getAttribute("data-act");
  if(a==="savef")return;
  ev.preventDefault();
  if(a==="sel"){ui.sel=b.getAttribute("data-id");ui.form=null;ui.confirm="";remember();renderMain();var sd=$("side");if(sd&&window.innerWidth<=900&&ui.view==="tree"){}}
  else if(a==="view"){ui.view=b.getAttribute("data-v");remember();render();}
  else if(a==="edit"){ui.edit=!ui.edit;if(!ui.edit){ui.form=null;ui.confirm="";}remember();render();}
  else if(a==="add"){ui.form=blank();renderMain();}
  else if(a==="addchild"){var p=P(ui.sel),f=blank(),sp=p.spouse?P(p.spouse):null;f.living=true;
    if(p.gender==="m"){f.father=p.id;if(sp)f.mother=sp.id;}else{f.mother=p.id;if(sp)f.father=sp.id;}
    ui.form=f;renderMain();}
  else if(a==="addspouse"){var p2=P(ui.sel),f2=blank();f2.gender=p2.gender==="m"?"f":"m";f2.spouse=p2.id;ui.form=f2;renderMain();}
  else if(a==="editp"){var q=P(ui.sel);ui.form=JSON.parse(JSON.stringify(q));renderMain();}
  else if(a==="cancelf"){ui.form=null;renderMain();}
  else if(a==="del"){ui.confirm="del:"+ui.sel;renderMain();}
  else if(a==="delno"){ui.confirm="";renderMain();}
  else if(a==="delok"){removePerson(ui.sel);render();}
  else if(a==="clear"){ui.confirm="clear";renderMain();}
  else if(a==="clearno"){ui.confirm="";renderMain();}
  else if(a==="clearok"){S.people=[];S.sample=false;S.title="Oila daraxti";ui.sel=null;ui.confirm="";ui.dirty=true;render();}
  else if(a==="save"){save();}
  else if(a==="discard"){try{sessionStorage.removeItem("ildiz-ui");}catch(e){}location.reload();}
  else if(a==="export"){
    if(dl)dl.save({filename:"ildiz-daraxt.json",data:JSON.stringify(S,null,2)}).catch(function(){});
  }
});
document.addEventListener("submit",function(ev){if(ev.target.id==="pf"){ev.preventDefault();readForm();}});
document.addEventListener("change",function(ev){
  if(ev.target.id==="f-living"){var d=$("f-died");d.disabled=ev.target.checked;if(ev.target.checked)d.value="";}
  if(ev.target.id==="ttl"){S.title=ev.target.value.trim()||"Oila daraxti";ui.dirty=true;renderBar();}
});
$("q").addEventListener("input",function(ev){ui.q=ev.target.value;renderMain();});

/* ---------- capabilities ---------- */
function caps(){
  if(!(window.claude&&window.claude.use))return;
  window.claude.use("artifact").then(function(a){art=a;},function(){});
  window.claude.use("user").then(function(u){try{canEdit=!!(u&&u.canEdit());}catch(e){canEdit=false;}renderTop();renderMain();},function(){});
  window.claude.use("downloads").then(function(d){dl=d;renderTop();},function(){});
}
render();
caps();
})();
</script></body></html>
